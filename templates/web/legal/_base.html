{% extends "base.html" %}

{% block title %}{{ page_title }} · {{ SITE_NAME }}{% endblock %}

{% block robots %}
  {% if legal_indexable %}
    <meta name="robots" content="index, follow">
  {% else %}
    <meta name="robots" content="noindex, follow">
  {% endif %}
{% endblock %}

{% block content %}
  <article class="max-w-2xl space-y-4 leading-relaxed text-slate-700">
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">{{ page_title }}</h1>
    {% block legal_content %}{% endblock %}
  </article>
{% endblock %}
