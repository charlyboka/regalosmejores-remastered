[project]
name = "regalosmejores"
version = "0.1.0"
description = "Spanish gift-discovery site monetised with Amazon Associates."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "django-environ>=0.12",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "httpx>=0.28",
    "openai>=1.60",
    "python-slugify>=8.0",
    "croniter>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "DJ"]
ignore = [
    "E501",   # line length is handled by the formatter
    "SIM105", # contextlib.suppress is not always clearer
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
